services:
  - type: web
    name: pps-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # config.asgi (no wsgi) + worker uvicorn: el estado en vivo de una sesión
    # ahora se sirve por Server-Sent Events (cafe/streaming.py), que necesita
    # un servidor ASGI -- las vistas sync existentes (incluida toda la API
    # REST) siguen andando igual bajo ASGI, Django las envuelve solo.
    # --timeout 0 porque una respuesta de streaming se queda "en silencio"
    # entre eventos, y el timeout de gunicorn mataría la conexión si no.
    # workers=2 en vez de 1 (el default) para no serializar todos los
    # requests detrás de un solo proceso -- conservador a propósito para no
    # pasarse de los 512MB del free tier (ver backend/loadtest/locustfile.py
    # para volver a medir el efecto real antes de subir este número).
    # max-requests recicla cada worker preventivamente cada ~500-550
    # requests (jitter para no sincronizar los reinicios de los dos
    # workers) -- evita que un worker se vaya degradando de a poco bajo
    # memoria ajustada hasta terminar devolviendo 502; en el peor caso corta
    # una conexión SSE activa, pero con reconexión automática es solo un
    # blip.
    startCommand: "gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --workers 2 --timeout 0 --max-requests 500 --max-requests-jitter 50"
    healthCheckPath: /admin/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.0"
