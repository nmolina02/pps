services:
  - type: web
    name: pps-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # workers=2 en vez de 1 (el default) para no serializar todos los
    # requests detrás de un solo proceso; gthread+threads=2 suma
    # concurrencia de I/O sin pagar el costo completo de memoria de más
    # procesos -- conservador a propósito para no pasarse de los 512MB
    # del free tier (ver backend/loadtest/locustfile.py para volver a
    # medir el efecto real antes de subir estos números).
    startCommand: "gunicorn config.wsgi:application --workers 2 --worker-class gthread --threads 2"
    healthCheckPath: /admin/login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.0"
